# Settings for Pages CMS (https://app.pagescms.org), a free editor that lets
# Ayden change the site from a web browser with forms instead of code.
# Sign in there with GitHub, pick this repository, and these screens appear.
# Every save is a normal commit, so the site republishes by itself.
#
# "merge: true" means anything in the JSON files that has no form field here
# is left untouched when a form is saved.
settings:
  content:
    merge: true

media:
  - name: photos
    label: Photos (one folder per category)
    input: media/photos
    output: /media/photos
    categories: [image]
  - name: posters
    label: Video poster images
    input: media/posters
    output: /media/posters
    categories: [image]
  - name: about
    label: About page portrait
    input: media/about
    output: /media/about
    categories: [image]

content:
  - name: projects
    label: Video projects
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects (drag to reorder; the order here is the order on the site)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Web address name (lowercase-with-dashes; do not change after launch)
            type: string
            required: true
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          - name: kind
            label: Type (for example Social Media Promotion, Event Recap, Short Film)
            type: string
          - name: category
            label: Column on the Work page
            type: select
            required: true
            options:
              values:
                - name: brand
                  label: Brand & Commercial
                - name: creative
                  label: Creative & Film
                - name: weddings
                  label: Weddings
          - name: client
            label: Client (leave empty for a personal film). To link a name, write [Name](https://...)
            type: string
          - name: role
            label: Role (for example Cinematographer, Editor, Colorist)
            type: string
          - name: camera
            label: Camera (for example Fujifilm X-T3)
            type: string
          - name: year
            label: Year
            type: number
          - name: youtube
            label: YouTube link (leave empty if the film file is hosted on the site)
            type: string
          - name: date
            label: Publish date (YYYY-MM-DD)
            type: string
          - name: duration
            label: Length in seconds
            type: number
          - name: aspect
            label: Shape, only for YouTube videos that are not widescreen (4:3 or 9:16)
            type: string
          - name: featured
            label: Show in "Selected work" on the home page (first six)
            type: boolean
            default: false
          - name: hidden
            label: Hide from the site
            type: boolean
            default: false
          - name: description
            label: Description
            type: text
          - name: credits
            label: Extra credits (artist, narration, a note). Type, client, role, camera, year and length are added automatically
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string

  - name: site
    label: Site text and settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: contact
        label: Contact
        type: object
        fields:
          - name: email
            label: Email shown on the site
            type: string
          - name: phone
            label: Phone (leave empty to hide)
            type: string
          - name: responseTime
            label: Response time note
            type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Name
            type: string
          - name: url
            label: Link
            type: string
      - name: form
        label: Contact form
        type: object
        fields:
          - name: web3formsKey
            label: Web3Forms access key
            type: string
      - name: home
        label: Home page
        type: object
        fields:
          - name: heroProjects
            label: The six titles over the reel (each project's web address name, top row first)
            type: string
            list: true
          - name: nameLine
            label: The small line under your name (each entry is one part; parts are joined with a slash)
            type: string
            list: true
          - name: statement
            label: Intro statement
            type: text
          - name: facts
            label: The three facts under the intro statement
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Text
                type: string
          - name: aboutHeading
            label: About teaser heading
            type: string
          - name: photoText
            label: Stills text
            type: text
          - name: cta
            label: Closing line
            type: string
      - name: about
        label: About page
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: lead
            label: Intro line
            type: text
          - name: bio
            label: Bio paragraphs
            type: text
            list: true
          - name: clients
            label: Worked with
            type: string
            list: true
