# Publishes the website to GitHub Pages every time something is pushed to the
# "main" branch (and when you press "Run workflow" on the Actions tab).
# It builds the site with `node build.js` and uploads the dist/ folder.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time. A newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The site has no packages to install, so there is nothing to cache.
          package-manager-cache: false
      - name: Build the site
        run: node build.js
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
